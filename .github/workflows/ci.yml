name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (core only)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest ruff

      - name: Zero-dependency core check
        run: python -c "import layerlint, layerlint.cli, layerlint.rules, layerlint.analyze, layerlint.sarif; print('core imports with no third-party package')"

      - name: Lint
        run: ruff check src tests

      - name: Tests
        run: pytest -q

      - name: Console scripts work from a base install
        run: |
          layerlint --help
          layerlint rules | head -3
          layerlint explain LYR502

      - name: Demo end to end
        run: |
          layerlint demo demo-workspace
          if layerlint scan demo-workspace --fail-on critical; then
            echo "expected a non-zero exit: the demo Dockerfile is deliberately hostile"
            exit 1
          fi
          echo "gate correctly blocked the demo Dockerfile"

      - name: A clean Dockerfile passes the gate
        run: |
          mkdir -p clean
          printf 'FROM alpine@sha256:%s\nUSER app\nWORKDIR /app\nLABEL org.opencontainers.image.source=x\nHEALTHCHECK NONE\nCMD ["app"]\n' "$(python -c 'print("a"*64)')" > clean/Dockerfile
          layerlint scan clean --fail-on high

      - name: SARIF output is valid
        run: |
          layerlint scan demo-workspace --sarif results.sarif
          python -c "import json; d=json.load(open('results.sarif')); assert d['version']=='2.1.0' and d['runs'][0]['results']; print('sarif ok')"

      - name: MCP manifest
        run: |
          python -m pip install -e ".[mcp]"
          python -c "
          import asyncio
          from layerlint.mcp_server import build_server, tool_manifest
          names = [t['name'] for t in tool_manifest()]
          assert all(t['description'] for t in tool_manifest())
          tools = asyncio.run(build_server().list_tools())
          print(f'{len(names)} tools:', ', '.join(sorted(names)))
          assert len(tools) == len(names)
          "

  # The README test badge is the first number a visitor reads; assert it against
  # pytest so it cannot drift silently.
  badge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[mcp]" pytest
      - name: README test-count badge vs pytest
        run: |
          collected=$(python -m pytest --collect-only -q -o addopts= 2>/dev/null | grep -oE '[0-9]+ tests? collected' | grep -oE '^[0-9]+' || true)
          badge=$(grep -oE 'tests-[0-9]+%20passing' README.md | head -1 | grep -oE '[0-9]+' || true)
          echo "collected=${collected:-NOTHING} badge=${badge:-NONE}"
          if [ -z "$collected" ]; then
            echo "::warning::pytest collected nothing - the badge check did not run"
          elif [ "$collected" != "$badge" ]; then
            echo "::warning::README badge says $badge but pytest collects $collected"
          fi
